name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=voice_ai_eval --cov-report=term-missing
      - run: voice-eval validate data/transcripts --policy data/policies/default.yaml
      - run: voice-eval run data/transcripts/good_appointment.json --provider mock --fail-below 0.75
