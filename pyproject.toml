[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-ai-eval"
version = "0.1.0"
description = "Production-oriented DeepEval harness for evaluating voice-agent transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jacob Beydullayev"}]
dependencies = [
  "deepeval>=4.0,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
voice-eval = "voice_ai_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_ai_eval"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
markers = ["llm: requires a real LLM judge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["voice_ai_eval"]
